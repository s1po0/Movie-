  donghua-catalog-check:
    if: contains(github.event.head_commit.message, '[donghua-catalog-check]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test && npm install --no-save --no-package-lock playwright-core && npm run build
      - run: node scripts/donghua-live-check.mjs
      - run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 5173 > /tmp/preview.log 2>&1 &
          node scripts/donghua-ui-check.mjs

  android-donghua-catalog-check:
    if: contains(github.event.head_commit.message, '[android-donghua-catalog-check]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci && npm test && npm run android:sync && cd android && ./gradlew --no-daemon assembleDebug
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: adb install android/app/build/outputs/apk/debug/app-debug.apk && adb shell appops set app.dimo.movies MANAGE_EXTERNAL_STORAGE allow && adb shell am start -n app.dimo.movies/.MainActivity && sleep 15 && pid=$(adb shell pidof app.dimo.movies | tr -d '\r') && adb forward tcp:9222 localabstract:webview_devtools_remote_$pid && node scripts/android-donghua-catalog-check.mjs

