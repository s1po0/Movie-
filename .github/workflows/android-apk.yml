name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleDebug > /tmp/gradle-build.log 2>&1 || {
            tail -60 /tmp/gradle-build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dimo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Export APK for this build
        if: contains(github.event.head_commit.message, '[apk-export]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import base64,json,pathlib; p=pathlib.Path("android/app/build/outputs/apk/debug/app-debug.apk"); json.dump({"content":base64.b64encode(p.read_bytes()).decode(),"encoding":"base64"},open("/tmp/apk-blob.json","w"))'
          blob=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --method POST --input /tmp/apk-blob.json --jq .sha)
          echo "::notice title=APK blob::$blob"
          echo "::notice title=APK sha256::$(sha256sum android/app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)"
