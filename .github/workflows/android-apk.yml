name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleDebug > /tmp/gradle-build.log 2>&1 || {
            tail -60 /tmp/gradle-build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dimo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Check live movie search and playback
        if: contains(github.event.head_commit.message, '[live-check]')
        run: |
          npm install --no-save --no-package-lock playwright-core
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 5173 > /tmp/dimo-preview.log 2>&1 &
          node scripts/live-check.mjs
