name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleDebug > /tmp/gradle-build.log 2>&1 || {
            tail -60 /tmp/gradle-build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dimo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish the requested debug APK
        if: contains(github.event.head_commit.message, '[publish-debug-apk]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/DIMO-debug.apk
          gh release upload dimo-debug-v1 /tmp/DIMO-debug.apk --clobber
          gh release edit dimo-debug-v1 --draft=false
