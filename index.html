<!doctype html>
<html lang="ckb" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101310" />
    <link rel="preconnect" href="https://v3-cinemeta.strem.io" crossorigin />
    <link rel="preconnect" href="https://cinemeta-catalogs.strem.io" crossorigin />
    <link rel="preconnect" href="https://vidlink.pro" crossorigin />
    <link rel="dns-prefetch" href="https://images.metahub.space" />
    <title>DIMO — فیلم و دراما</title>
    <style>
      html, body { min-height: 100%; margin: 0; background: #101310; color: #f4f4ee; }
      .startup { min-height: 100vh; display: grid; place-content: center; gap: 16px; padding: 24px; text-align: center; font: 16px sans-serif; }
      .startup button { justify-self: center; padding: 10px 18px; border: 0; border-radius: 7px; background: #d8f36a; color: #17200e; cursor: pointer; }
      .startup button[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="app"><div class="startup" role="status"><span>بەرنامەکە بار دەکرێت...</span><button type="button" hidden onclick="location.reload()">نوێکردنەوە</button></div></div>
    <script>
      function showStartupError() {
        const startup = document.querySelector('#app .startup');
        if (!startup) return;
        startup.querySelector('span').textContent = 'بەرنامەکە بار نەبوو؛ پەڕەکە نوێ بکەرەوە.';
        startup.querySelector('button').hidden = false;
      }
      window.addEventListener('error', showStartupError, true);
      setTimeout(showStartupError, 15000);
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
